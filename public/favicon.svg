<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEE8D6"/>
      <stop offset="1" stop-color="#C9C1A9"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#16260C"/>
      <stop offset="1" stop-color="#030503"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- stand -->
  <path d="M24 50h16l4 7H20z" fill="#B3AB93"/>
  <rect x="14" y="56" width="36" height="5" rx="2.5" fill="#C9C1A9" stroke="#6E6852" stroke-width="1.5"/>
  <!-- CRT case -->
  <rect x="3" y="4" width="58" height="48" rx="9" fill="url(#case)" stroke="#6E6852" stroke-width="2"/>
  <!-- screen -->
  <rect x="9" y="9" width="46" height="35" rx="6" fill="url(#glass)" stroke="#5E5844" stroke-width="1.5"/>
  <!-- prompt -->
  <g filter="url(#glow)" fill="none" stroke="#B4F25A" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M17 18l9 8.5-9 8.5"/>
  </g>
  <rect x="30" y="32" width="15" height="5" fill="#B4F25A" filter="url(#glow)"/>
  <!-- power LED -->
  <circle cx="53" cy="48" r="1.6" fill="#B4F25A"/>
</svg>
