  <script>
    // Pick light/dark before the first paint (kept in sync with useTheme in src/sites/retro/RetroUI.js).
    (function () {
      var t;
      try { t = localStorage.getItem('gaven-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
